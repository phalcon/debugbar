# octocov configuration - https://github.com/k1LoW/octocov
#
# Default config: used on pushes (including the default branch).
# The gate here is a stable FLOOR only, so a coverage measurement blip on the
# default branch never red-Xs the build. Pull requests use octocov.pr.yml,
# which adds the no-regression (diff >= 0) ratchet on top of this floor.
#
# Paths below are relative to THIS file's directory (resources/), not the repo
# root - octocov resolves them that way, so everything is prefixed `../`.
#
# NOTE: coverage runs on the v6 provider only. Revisit this floor in Phase 2
# when version-specific Bridge code (Phalcon5Bridge) that a v6 run cannot
# exercise is introduced.
coverage:
  paths:
    - ../tests/_output/coverage.xml
  acceptable: "current >= 100.0%"
  badge:
    path: ../tests/_output/coverage.svg
codeToTestRatio:
  code:
    - ../src/**/*.php
  test:
    - ../tests/**/*.php
testExecutionTime:
  steps:
    - Tests with coverage
comment:
  if: is_pull_request
summary:
  if: true
diff:
  datastores:
    - artifact://${GITHUB_REPOSITORY}
report:
  if: is_default_branch
  datastores:
    - artifact://${GITHUB_REPOSITORY}
